<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>团购管理 · 榨榨鲜果</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;background:#f4f6f2;color:#333;max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:40px}
#top{position:sticky;top:0;z-index:9;background:#1b5e20;color:#fff;display:flex;align-items:center;padding:12px 14px;gap:10px}
#top .back{font-size:20px;cursor:pointer;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.15);flex:none}
#top .title{font-size:17px;font-weight:700;flex:1;text-align:center}
.pad{padding:12px 14px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;color:#fff}
.b-open{background:#43a047}.b-quoted{background:#fb8c00}.b-delivering{background:#1e88e5}.b-arrived{background:#e53935}.b-ended{background:#78909c}.b-cancelled{background:#9e9e9e}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0}
.row b{font-size:15px}
.muted{color:#888;font-size:12px}
.price{color:#e53935;font-weight:800}
.btn{display:inline-block;border:none;border-radius:8px;padding:8px 14px;font-size:13.5px;font-weight:700;cursor:pointer;margin:4px 4px 0 0}
.btn-p{background:#2e7d32;color:#fff}
.btn-o{background:#fff;color:#2e7d32;border:1.5px solid #2e7d32}
.btn-r{background:#fff;color:#c62828;border:1.5px solid #c62828}
.btn-g{background:#eee;color:#666}
input,select{width:100%;border:1.5px solid #ddd;border-radius:8px;padding:10px;font-size:14px;margin-top:6px;background:#fff}
label{font-size:13px;color:#666;display:block;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:8px 6px;border-bottom:1px solid #f0f0f0;text-align:left}
th{color:#888;font-weight:600;font-size:12px}
.st{font-size:12px;padding:2px 8px;border-radius:12px;color:#fff}
.s-joined{background:#43a047}.s-confirmed{background:#fb8c00}.s-picked{background:#1e88e5}.s-missed{background:#78909c}.s-withdrawn{background:#bdbdbd}.s-cancelled{background:#9e9e9e}
.okbar{background:#e8f5e9;color:#2e7d32;font-size:13px;padding:10px;border-radius:10px;margin-top:10px;display:none}
.errbar{background:#fce4ec;color:#c62828;font-size:13px;padding:10px;border-radius:10px;margin-top:10px;display:none}
.hidden{display:none}
#quoteBox{border-top:1.5px dashed #e0e0e0;margin-top:10px;padding-top:10px}
</style>
</head>
<body>
<div id="top"><span class="back" onclick="location.href='index.html?autologin=1#/admin'">‹</span><span class="title">团购接龙管理</span><span class="right" style="width:34px;"></span></div>
<div class="pad">
  <div id="login" class="card">
    <b style="font-size:15px;">需要登录老板后台</b>
    <div style="font-size:13px;color:#888;margin-top:6px;">请从「老板后台 → 团购管理」进入，或回到首页重新登录。</div>
    <button class="btn btn-p" style="width:100%;margin-top:10px;" onclick="location.href='index.html?autologin=1#/admin'">去登录</button>
  </div>

  <div id="main" class="hidden">
    <div class="card">
      <b style="font-size:15px;">➕ 开新团购</b>
      <label>活动标题</label>
      <input id="oTitle" placeholder="如：周末团购·红心猕猴桃" maxlength="30">
      <label>成团目标（份数/斤数，合计达到即成团）</label>
      <input id="oTarget" type="number" placeholder="如：10" min="1" step="1">
      <label>接龙截止时间</label>
      <input id="oDeadline" type="datetime-local">
      <button class="btn btn-p" style="width:100%;margin-top:12px;" onclick="doOpen()">发布团购</button>
      <div class="okbar" id="okbar"></div>
      <div class="errbar" id="errbar"></div>
    </div>
    <div id="list"></div>
  </div>

  <div id="detail" class="hidden">
    <button class="btn btn-g" onclick="showList()">‹ 返回列表</button>
    <div id="dCard"></div>
    <div id="dReq"></div>
    <div id="dOps"></div>
  </div>
</div>
<script>
var SB_URL='https://aenrwtwhhuqzmbxsjump.supabase.co';
var SB_KEY='sb_publishable_TYMADeCoaKMsnJ7INuHnfQ_n9yKIHkl';
var LS_SESSION='fruit_admin_ok';
var cur=null; var timer=null;
function api(fn,body){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json();});
}
function isAdmin(){
  var ok=(location.href.indexOf('autologin=1')>=0)&&localStorage.getItem(LS_SESSION)==='1';
  return ok;
}
function pwd(){ try{ return localStorage.getItem('fruit_cloud_pwd')||'1986shenhu'; }catch(e){ return '1986shenhu'; } }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stName(s){ return {open:'接龙中',quoted:'待确认',delivering:'进货中',arrived:'可取货',ended:'已结束',cancelled:'已取消'}[s]||s; }
function stCls(s){ return {open:'b-open',quoted:'b-quoted',delivering:'b-delivering',arrived:'b-arrived',ended:'b-ended',cancelled:'b-cancelled'}[s]||'b-ended'; }
function fmtT(t){ if(!t) return ''; var d=new Date(t); function p(x){return (x<10?'0':'')+x;} return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtN(n){ var v=Number(n); return (v===Math.floor(v))?String(v):v.toFixed(1); }
function nowLocal(){ var d=new Date(); function p(x){return (x<10?'0':'')+x;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes()); }
function okbar(on,t){ var e=document.getElementById('okbar'); e.style.display=on?'block':'none'; e.textContent=t; }
function errbar(on,t){ var e=document.getElementById('errbar'); e.style.display=on?'block':'none'; e.textContent=t; }
function msgBox(on,t){ okbar(on,t); }
function showList(){
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('detail').classList.add('hidden');
  api('groupon_list',{}).then(function(arr){
    var el=document.getElementById('list');
    if(!Array.isArray(arr)||!arr.length){ el.innerHTML='<div class="card" style="color:#999;text-align:center;">还没有团购，先在上面开一个吧</div>'; return; }
    el.innerHTML=arr.map(function(s){
      return '<div class="card"><div class="row"><b>'+esc(s.title)+'</b><span class="badge '+stCls(s.status)+'">'+stName(s.status)+'</span></div>'+
      '<div class="row" style="padding-top:2px;"><span>已接龙 '+fmtN(s.joined_qty)+' / 目标 '+fmtN(s.target_qty)+'</span><span>'+s.people+' 人</span></div>'+
      '<div class="row"><span class="muted">截止 '+fmtT(s.deadline)+(s.unit_price!=null?' · 单价 ¥'+fmtN(s.unit_price):'')+'</span></div>'+
      '<button class="btn btn-p" onclick="openDetail('+s.id+')">查看/操作</button></div>';
    }).join('');
  }).catch(function(){ document.getElementById('list').innerHTML='<div class="card" style="color:#c62828;">加载失败</div>'; });
}
function openDetail(id){
  cur=id; showDetail(); clearInterval(timer); timer=setInterval(showDetail,60000);
}
function showDetail(){
  document.getElementById('main').classList.add('hidden');
  document.getElementById('detail').classList.remove('hidden');
  api('groupon_list',{}).then(function(arr){
    var s=null; (arr||[]).forEach(function(x){ if(x.id===cur) s=x; });
    if(!s){ document.getElementById('dCard').innerHTML='<div class="card">不存在</div>'; return; }
    document.getElementById('dCard').innerHTML='<div class="card"><div class="row"><b>'+esc(s.title)+'</b><span class="badge '+stCls(s.status)+'">'+stName(s.status)+'</span></div>'+
      '<div class="row"><span>已接龙</span><b style="color:#43a047;">'+fmtN(s.joined_qty)+' 份 / '+s.people+' 人</b></div>'+
      '<div class="row"><span>目标</span><b>'+fmtN(s.target_qty)+' 份</b></div>'+
      '<div class="row"><span>截止</span><b>'+fmtT(s.deadline)+'</b></div>'+
      (s.unit_price!=null?'<div class="row"><span>单价</span><span class="price">¥'+fmtN(s.unit_price)+'</span></div>':'')+
      (s.status==='quoted'?'<div class="row"><span>确认截止</span><b>'+fmtT(s.confirm_deadline)+'</b></div>':'')+
      '</div>';
    // 操作区
    var ops=document.getElementById('dOps');
    var h='<div class="card" id="opsCard"><b>操作</b>';
    if(s.status==='open'){
      h+='<div class="muted" style="margin:6px 0;">未到截止可手动判定（提前截止）</div><button class="btn btn-p" onclick="autoCheck()">🕐 截止判定</button><button class="btn btn-r" onclick="doCancel()">取消本团</button>';
    }else if(s.status==='quoted'&&s.unit_price==null){
      h+='<div id="quoteBox"><label>单价 = 进货价 + 运费（成本价）</label><input id="qPrice" type="number" placeholder="如：15.5" step="0.1" min="0.1"><button class="btn btn-p" style="width:100%;" onclick="doQuote()">报价并推送顾客确认</button></div>';
    }else if(s.status==='quoted'&&s.unit_price!=null){
      h+='<div class="muted" style="margin:6px 0;">已报价 ¥'+fmtN(s.unit_price)+'，顾客确认中（确认 '+fmtN(s.confirmed_qty)+' 份）。达标后点「开始进货」，不足可取消。</div>'+
      '<button class="btn btn-p" onclick="doDeliver()">✅ 确认量达标·开始进货</button><button class="btn btn-r" onclick="doCancel()">取消本团</button>';
    }else if(s.status==='delivering'){
      h+='<div class="muted" style="margin:6px 0;">进货中。到货后点「已到货」通知顾客来取。</div><button class="btn btn-p" onclick="doArrive()">📦 已到货·通知来取</button>';
    }else if(s.status==='arrived'){
      h+='<div class="muted" style="margin:6px 0;">顾客来取时报手机号核销，全部取完可结束。</div>'+
      '<div style="display:flex;gap:8px;margin-top:8px;"><input id="pkPhone" type="tel" placeholder="顾客手机号" maxlength="11" style="margin:0;flex:1;"><button class="btn btn-p" onclick="doPick()">核销</button></div>'+
      '<button class="btn btn-g" onclick="doEnd()">结束本团</button>';
    }else if(s.status==='cancelled'||s.status==='ended'){
      h+='<div class="muted" style="margin:6px 0;">本团已'+stName(s.status)+'，只读。</div>';
    }
    ops.innerHTML=h+'</div>';
    return api('groupon_requests_list',{p_admin:pwd(),p_session_id:cur});
  }).then(function(r){
    if(!Array.isArray(r)) return;
    var el=document.getElementById('dReq');
    if(!r.length){ el.innerHTML='<div class="card" style="color:#999;">暂无参与记录</div>'; return; }
    el.innerHTML='<div class="card"><b>参与明细（'+r.length+' 条）</b><table><tr><th>手机号</th><th>商品</th><th>数量</th><th>状态</th></tr>'+
      r.map(function(x){
        var st={joined:'已参与',confirmed:'已确认',picked:'已取',missed:'未取',withdrawn:'退出',cancelled:'取消'}[x.status]||x.status;
        var sc={joined:'s-joined',confirmed:'s-confirmed',picked:'s-picked',missed:'s-missed',withdrawn:'s-withdrawn',cancelled:'s-cancelled'}[x.status]||'s-cancelled';
        return '<tr><td>'+esc(x.phone)+'</td><td>'+esc(x.item_name)+'</td><td>'+fmtN(x.qty)+' '+esc(x.unit)+'</td><td><span class="st '+sc+'">'+st+'</span></td></tr>';
      }).join('')+'</table></div>';
  }).catch(function(){});
}
function doOpen(){
  var t=document.getElementById('oTitle').value.trim();
  var g=document.getElementById('oTarget').value;
  var d=document.getElementById('oDeadline').value;
  if(!t){ errbar(true,'请填写活动标题'); return; }
  if(!g||Number(g)<=0){ errbar(true,'请填写目标份数'); return; }
  if(!d){ errbar(true,'请选择截止时间'); return; }
  api('groupon_open',{p_admin:pwd(),p_title:t,p_target_qty:Number(g),p_deadline:new Date(d).toISOString()}).then(function(r){
    if(r.ok){ okbar(true,'✅ 团购已发布！'); document.getElementById('oTitle').value=''; document.getElementById('oTarget').value=''; showList(); }
    else errbar(true,r.msg||'发布失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
function autoCheck(){
  api('groupon_auto_check',{p_session_id:cur}).then(function(r){
    if(r.ok){ okbar(true,r.msg?('✅ '+r.msg):('✅ '+(r.result||'判定完成'))); showDetail(); }
    else errbar(true,r.msg||'判定失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
function doQuote(){
  var p=document.getElementById('qPrice').value;
  if(!p||Number(p)<=0){ errbar(true,'请填写单价'); return; }
  api('groupon_quote',{p_admin:pwd(),p_session_id:cur,p_price:Number(p)}).then(function(r){
    if(r.ok){ okbar(true,'✅ 已报价，顾客端已推送确认（限时24小时）'); showDetail(); }
    else errbar(true,r.msg||'报价失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
function doDeliver(){
  if(!confirm('确认已达标？开始进货后顾客不可再退出。')) return;
  api('groupon_deliver',{p_admin:pwd(),p_session_id:cur}).then(function(r){
    if(r.ok){ okbar(true,'✅ 已进入进货中'); showDetail(); }
    else errbar(true,r.msg||'操作失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
function doArrive(){
  if(!confirm('确认已到货？将通知顾客来取。')) return;
  api('groupon_arrive',{p_admin:pwd(),p_session_id:cur}).then(function(r){
    if(r.ok){ okbar(true,'✅ 已通知：顾客端显示可取货'); showDetail(); }
    else errbar(true,r.msg||'操作失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
function doPick(){
  var p=document.getElementById('pkPhone').value.trim();
  if(!/^1\d{10}$/.test(p)){ errbar(true,'请填写正确的手机号'); return; }
  api('groupon_pick',{p_admin:pwd(),p_session_id:cur,p_phone:p}).then(function(r){
    if(r.ok){ okbar(true,'✅ 已核销'); document.getElementById('pkPhone').value=''; showDetail(); }
    else errbar(true,r.msg||'核销失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
function doCancel(){
  if(!confirm('确定取消本团？所有参与者将被通知取消。')) return;
  api('groupon_cancel',{p_admin:pwd(),p_session_id:cur}).then(function(r){
    if(r.ok){ okbar(true,'✅ 已取消'); showDetail(); }
    else errbar(true,r.msg||'取消失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
function doEnd(){
  if(!confirm('确定结束本团？未取货将标记为未取。')) return;
  api('groupon_end',{p_admin:pwd(),p_session_id:cur}).then(function(r){
    if(r.ok){ okbar(true,'✅ 已结束'); showDetail(); }
    else errbar(true,r.msg||'结束失败');
  }).catch(function(){ errbar(true,'网络异常'); });
}
// 初始化
if(isAdmin()){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('oDeadline').value=nowLocal();
  showList();
}else{
  document.getElementById('main').classList.add('hidden');
}
</script>
</body>
</html>
