<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b5e20'/%3E%3Ctext x='32' y='45' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E榨%3C/text%3E%3C/svg%3E">
<title>团购接龙 · 榨榨鲜果</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#cde8c6 0%,#e9f3e2 20%,#f2efc8 46%,#e4efdf 76%,#f3f7ef 100%);color:#2b2b2b;max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:50px;position:relative;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(640px 460px at 6% -8%,rgba(35,134,0,.40),transparent 64%),
  radial-gradient(560px 420px at 100% 0%,rgba(255,152,0,.22),transparent 64%),
  radial-gradient(720px 540px at 80% 55%,rgba(223,255,43,.28),transparent 64%),
  radial-gradient(600px 480px at 0% 80%,rgba(79,165,10,.22),transparent 62%),
  radial-gradient(420px 340px at 50% 100%,rgba(255,152,0,.13),transparent 60%),
  radial-gradient(380px 300px at 55% 26%,rgba(255,255,255,.62),transparent 62%),
  radial-gradient(260px 220px at 88% 26%,rgba(223,255,43,.18),transparent 60%)}
#top{position:sticky;top:0;z-index:99;background:linear-gradient(135deg,rgba(35,134,0,.9) 0%,rgba(35,134,0,.9) 55%,rgba(79,165,10,.9));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#fff;display:flex;align-items:center;padding:14px 16px;gap:10px;box-shadow:0 4px 18px rgba(35,134,0,.3),inset 0 1px 0 rgba(255,255,255,.14);position:relative;overflow:hidden}
#top::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 160px at 16% -40%,rgba(255,255,255,.2),transparent 60%),radial-gradient(280px 140px at 88% -30%,rgba(223,255,43,.22),transparent 60%);pointer-events:none}
#top .back{font-size:20px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.18);flex:none;transition:background .2s,transform .15s;border:1px solid rgba(255,255,255,.14)}
#top .back:active{background:rgba(255,255,255,.35);transform:scale(.9)}
#top .title{font-size:18px;font-weight:800;flex:1;text-align:center;letter-spacing:1px;text-shadow:0 1px 2px rgba(0,0,0,.12);position:relative}
#top .right{width:36px;flex:none}
.pad{padding:14px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.38);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 10px 30px rgba(35,134,0,.09),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 .5px rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.9);transition:transform .18s cubic-bezier(.34,1.3,.64,1),box-shadow .18s;-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%);animation:cardIn .4s cubic-bezier(.22,.9,.32,1) backwards}
.card:nth-child(2){animation-delay:.06s}
.card:nth-child(3){animation-delay:.12s}
.card:nth-child(4){animation-delay:.18s}
.card:nth-child(n+5){animation-delay:.24s}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.card:active{transform:scale(.985)}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;color:#fff;letter-spacing:.5px;box-shadow:0 2px 6px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.18)}
.b-open{background:linear-gradient(135deg,#4fa50a,#7ccf2e)}
.b-quoted{background:linear-gradient(135deg,#fb8c00,#ffa726)}
.b-delivering{background:linear-gradient(135deg,#1e88e5,#42a5f5)}
.b-arrived{background:linear-gradient(135deg,#e53935,#ef5350)}
.b-ended{background:linear-gradient(135deg,#78909c,#90a4ae)}
.b-cancelled{background:linear-gradient(135deg,#9e9e9e,#bdbdbd)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:6px 0}
.row b{font-size:15px}
.muted{color:#999;font-size:12px}
.price{color:#e53935;font-weight:800;font-size:17px}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:12px;font-size:15px;font-weight:800;cursor:pointer;margin-top:10px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .15s,opacity .12s;box-shadow:0 3px 10px rgba(0,0,0,.1),inset 0 1px 0 rgba(255,255,255,.18)}
.btn:active{transform:scale(.96);box-shadow:0 0 0 10px rgba(79,165,10,.12)}
.btn-p{background:linear-gradient(135deg,#238600,#4fa50a);color:#fff}
.btn-o{background:rgba(255,255,255,.72);color:#238600;border:1.5px solid #238600;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.btn-g{background:rgba(240,242,240,.7);color:#777;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
input,select{width:100%;border:1.5px solid rgba(255,255,255,.95);border-radius:12px;padding:11px;font-size:16px;margin-top:6px;background:rgba(255,255,255,.6);transition:border .2s,box-shadow .2s,background .2s;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
input:focus,select:focus{outline:none;border-color:#4fa50a;background:rgba(255,255,255,.88);box-shadow:0 0 0 3px rgba(79,165,10,.14)}
label{font-size:12.5px;color:#777;display:block;margin-top:12px;font-weight:600}
.bar{height:10px;background:rgba(255,255,255,.55);border-radius:8px;overflow:hidden;margin:8px 0;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4fa50a,#8bc34a);border-radius:8px;transition:width .5s}
.item{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.75);font-size:14px}
.item:last-child{border:none}
.item .q{font-weight:800;color:#e53935}
.hidden{display:none}
#myBox{background:rgba(255,255,255,.38);border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 10px 30px rgba(35,134,0,.09),inset 0 1px 0 rgba(255,255,255,.85),inset 0 0 0 .5px rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.9);-webkit-backdrop-filter:blur(34px) saturate(200%);backdrop-filter:blur(34px) saturate(200%)}
.myrec{border:1px solid rgba(255,255,255,.9);border-radius:14px;padding:11px;margin-top:9px;font-size:14px;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px) saturate(180%);backdrop-filter:blur(14px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.notice{background:rgba(255,248,225,.55);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px dashed rgba(240,212,138,.9);border-radius:14px;padding:11px;font-size:12.5px;color:#8d6e63;margin-top:10px}
.okbar{background:rgba(234,246,221,.6);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);color:#238600;font-size:13px;padding:11px 14px;border-radius:14px;margin-top:12px;display:none;border:1px solid rgba(200,230,201,.9);font-weight:600}
.errbar{background:rgba(252,228,236,.6);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);color:#c62828;font-size:13px;padding:11px 14px;border-radius:14px;margin-top:12px;display:none;border:1px solid rgba(248,187,208,.9);font-weight:600}
.hd2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:4px}
.hd2 .ico{width:26px;height:26px;border-radius:9px;background:linear-gradient(135deg,#238600,#4fa50a);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;box-shadow:0 2px 6px rgba(35,134,0,.28)}
.empty{padding:26px 10px;text-align:center;color:#aaa}
.empty .eico{font-size:34px;margin-bottom:8px}
/* 本月当季推荐 */
.recStrip{display:flex;overflow-x:auto;gap:10px;padding:4px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.recStrip::-webkit-scrollbar{display:none}
.recItem{flex:0 0 auto;width:104px;text-align:center}
.recItem .thumb{width:100%;height:74px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.recItem .ph{width:100%;height:74px;border-radius:12px;background:rgba(236,239,240,.55);display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;border:1px solid rgba(255,255,255,.85)}
.t-best{background:linear-gradient(135deg,#e53935,#fb8c00)}
.t-good{background:linear-gradient(135deg,#4fa50a,#7ccf2e)}
.t-tail{background:linear-gradient(135deg,#f9a825,#fbc02d)}
.t-normal{background:linear-gradient(135deg,#9e9e9e,#bdbdbd)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(35,134,0,.25);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

</style>
</head>
<body>
<div id="top"><span class="back" onclick="goHome()">‹</span><span class="title">🍉 团购接龙</span><span class="right"></span></div>
<div class="pad" id="listView">
  <div class="notice">💡 <b>想买什么就发起接龙</b>，凑够目标份数老板就去进货；不够自动取消。价格=进货价+运费，不赚差价，确认后才进货。</div>
  <div id="recBox"></div>
  <div id="list"></div>
</div>
<div class="pad hidden" id="detailView">
  <div id="bigView" onclick="this.style.display='none'" style="position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;cursor:zoom-out;"><img id="bigImg" src="" style="max-width:94%;max-height:92%;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);"></div>
  <div id="dCard"></div>
  <div id="dPlan"></div>
  <div class="notice hidden" id="dJoinNote">📢 接龙中：发起或跟团，截止后自动判定。</div>
  <div class="notice hidden" id="dQuoteNote">⏳ 已达标！老板正在定价（进货价+运费），定价后请确认。</div>
  <div class="notice hidden" id="dConfirmNote">💰 单价已出：<b id="dPrice"></b> 请确认是否购买（限时24小时，超时自动退出）。</div>
  <div class="notice hidden" id="dArriveNote">📦 已到货，请来取！自取免运费，外送 2元/公里。</div>
  <div id="dItems"></div>
  <div id="myBox">
    <div class="hd2"><span class="ico">🔍</span>查看我的团购</div>
    <label>填手机号查询</label>
    <input type="tel" id="myPhone" placeholder="请输入手机号" maxlength="11">
    <button class="btn btn-p" onclick="loadMy()">查询我的记录</button>
    <div id="myRecs"></div>
  </div>
  <div id="joinBox">
    <div class="hd2" style="margin-top:14px;"><span class="ico">🛒</span>参与本团</div>
    <div id="jItemTip" style="font-size:13.5px;color:#4fa50a;font-weight:800;margin-bottom:6px;"></div>
    <input type="tel" id="jPhone" placeholder="手机号" maxlength="11">
    <div style="display:flex;gap:8px;">
      <input type="number" id="jQty" placeholder="份数" min="0.5" step="0.5" style="flex:1">
      <select id="jUnit" style="flex:1"><option>份</option><option>斤</option><option>个</option><option>盒</option><option>根</option><option>杯</option></select>
    </div>
    <div id="jDepTip" class="hidden" style="background:#fff7e6;border:1px solid #ffd591;border-radius:10px;padding:10px;margin:8px 0;font-size:13px;color:#ad6800;">
      本团定金 <span id="jDepAmt" style="color:#c62828;font-weight:800;">¥0</span>/份，接龙确定后扫本店收款码支付；尾款到店取货时支付。
    </div>
    <button class="btn btn-p" onclick="doJoin()">参与本团</button>
    <div class="okbar" id="okbar"></div>
    <div class="errbar" id="errbar"></div>
  </div>
</div>
<script src="qrcode.js"></script>
<script>
var SB_URL='https://aenrwtwhhuqzmbxsjump.supabase.co';
var SB_KEY='sb_publishable_TYMADeCoaKMsnJ7INuHnfQ_n9yKIHkl';
var curSession=null; var timer=null;
function api(fn,body){
  return fetch(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})}).then(function(r){return r.json();});
}
function goHome(){ location.href='index.html'; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stName(s){ return {open:'接龙中',quoted:'待确认',delivering:'进货中',arrived:'可取货',ended:'已结束',cancelled:'已取消'}[s]||s; }
function stCls(s){ return {open:'b-open',quoted:'b-quoted',delivering:'b-delivering',arrived:'b-arrived',ended:'b-ended',cancelled:'b-cancelled'}[s]||'b-ended'; }
function fmtT(t){ if(!t) return ''; var d=new Date(t); function p(x){return (x<10?'0':'')+x;} return p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtN(n){ var v=Number(n); return (v===Math.floor(v))?String(v):v.toFixed(1); }
function showList(){
  document.getElementById('listView').classList.remove('hidden');
  document.getElementById('detailView').classList.add('hidden');
  loadRec();
  api('groupon_list',{}).then(function(arr){
    var el=document.getElementById('list');
    if(!Array.isArray(arr)||!arr.length){ el.innerHTML='<div class="card empty"><div class="eico">🍃</div>暂无团购活动<br><span style="font-size:12px;color:#bbb;">等老板开团后再来参与吧</span></div>'; return; }
    el.innerHTML=arr.map(function(s){
      var ph='';
      if(s.status==='open') ph='<span class="muted">截止 '+fmtT(s.deadline)+'</span>';
      else if(s.status==='quoted') ph='<span class="muted">'+(s.unit_price?('单价 ¥'+fmtN(s.unit_price)):'等待老板报价')+'</span>';
      else if(s.status==='arrived') ph='<span class="price">已到货·请来取</span>';
      else if(s.status==='delivering') ph='<span class="muted">老板进货中</span>';
      var img=s.cover?'<img loading="lazy" src="'+esc(s.cover)+'" style="width:100%;max-height:120px;object-fit:cover;border-radius:12px;margin-bottom:10px;" onerror="this.style.display=\'none\'">':'';
      var pct=Math.min(100,Math.round(s.joined_qty/s.target_qty*100));
      return '<div class="card" onclick="openDetail('+s.id+')" style="cursor:pointer;">'+img+
        '<div class="row"><b>'+esc(s.title)+'</b><span class="badge '+stCls(s.status)+'">'+stName(s.status)+'</span></div>'+
        '<div style="display:flex;gap:8px;align-items:center;margin:10px 0 4px;">'+
          '<div style="flex:1;height:10px;background:#f0f4ee;border-radius:8px;overflow:hidden;"><div style="height:100%;width:'+pct+'%;background:linear-gradient(90deg,#4fa50a,#8bc34a);border-radius:8px;transition:width .5s;"></div></div>'+
          '<span style="font-size:12.5px;font-weight:800;color:#4fa50a;">'+fmtN(s.joined_qty)+'/'+fmtN(s.target_qty)+'</span>'+
        '</div>'+
        '<div class="row" style="padding-top:0;">'+ph+(Number(s.deposit)>0?'<span class="price" style="color:#c62828;font-size:12px;">定金 ¥'+fmtN(s.deposit)+'/份</span>':'')+'<span class="muted">'+s.people+' 人参与</span></div></div>';
    }).join('');
  }).catch(function(){ document.getElementById('list').innerHTML='<div class="card empty"><div class="eico">📡</div>加载失败，请检查网络</div>'; });
}
function openDetail(id){
  curSession=id; showDetail(); clearInterval(timer);
  timer=setInterval(showDetail,60000);
}
function showDetail(){
  document.getElementById('listView').classList.add('hidden');
  document.getElementById('detailView').classList.remove('hidden');
  api('groupon_list',{}).then(function(arr){
    var s=null; (arr||[]).forEach(function(x){ if(x.id===curSession) s=x; });
    if(!s){ document.getElementById('dCard').innerHTML='<div class="card empty"><div class="eico">🤔</div>团购不存在</div>'; return; }
    window._sessTitle=s.title;
    document.getElementById('dJoinNote').classList.toggle('hidden', s.status!=='open');
    document.getElementById('dQuoteNote').classList.toggle('hidden', s.status!=='quoted'||s.unit_price!=null);
    document.getElementById('dConfirmNote').classList.toggle('hidden', s.status!=='quoted'||s.unit_price==null);
    if(s.unit_price!=null) document.getElementById('dPrice').textContent='¥'+fmtN(s.unit_price);
    document.getElementById('dArriveNote').classList.toggle('hidden', s.status!=='arrived');
    loadPlanCust();
    var join=document.getElementById('joinBox');
    join.style.display = (s.status==='open')?'block':'none';
    var depTip=document.getElementById('jDepTip');
    if(Number(s.deposit)>0){ depTip.style.display='block'; document.getElementById('jDepAmt').textContent='¥'+fmtN(s.deposit); }
    else { depTip.style.display='none'; }
    var img=s.cover?'<img src="'+esc(s.cover)+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-bottom:10px;cursor:zoom-in;" onclick="event.stopPropagation();document.getElementById(\'bigImg\').src=this.src;document.getElementById(\'bigView\').style.display=\'flex\';" onerror="this.style.display=\'none\'">':'';
    document.getElementById('dCard').innerHTML=
      '<div class="card">'+img+
      '<div class="row"><b>'+esc(s.title)+'</b><span class="badge '+stCls(s.status)+'">'+stName(s.status)+'</span></div>'+
      '<div style="display:flex;gap:8px;align-items:center;margin:10px 0 4px;">'+
        '<div style="flex:1;height:10px;background:#f0f4ee;border-radius:8px;overflow:hidden;"><div style="height:100%;width:'+Math.min(100,Math.round(s.joined_qty/s.target_qty*100))+'%;background:linear-gradient(90deg,#4fa50a,#8bc34a);border-radius:8px;"></div></div>'+
        '<span style="font-size:12.5px;font-weight:800;color:#4fa50a;">'+fmtN(s.joined_qty)+'/'+fmtN(s.target_qty)+' 份</span>'+
      '</div>'+
      '<div class="row" style="padding-top:0;"><span>目标</span><b>'+fmtN(s.target_qty)+' 份</b></div>'+
      '<div class="row"><span>参与人数</span><b style="color:#4fa50a;">'+s.people+' 人</b></div>'+
      (s.per_limit>0?'<div class="row"><span>每人限购</span><b>'+fmtN(s.per_limit)+' 份</b></div>':'')+
      '<div class="row"><span>截止时间</span><b>'+fmtT(s.deadline)+'</b></div>'+
      (Number(s.deposit)>0?'<div class="row"><span>每份预定金</span><span class="price" style="color:#c62828;">¥'+fmtN(s.deposit)+'</span></div>':'')+
      (s.note?'<div class="row" style="align-items:flex-start;"><span>说明</span><b style="text-align:right;font-weight:600;">'+esc(s.note)+'</b></div>':'')+
      (s.pickup_time?'<div class="row"><span>取货时间</span><b style="color:#238600;">'+esc(s.pickup_time)+'</b></div>':'')+
      (s.unit_price!=null?'<div class="row"><span>团购单价</span><span class="price">¥'+fmtN(s.unit_price)+'</span></div>':'')+
      (s.status==='quoted'?'<div class="row"><span>确认截止</span><b>'+fmtT(s.confirm_deadline)+'</b></div>':'')+
      '</div>';
    return api('groupon_items',{p_session_id:curSession});
  }).then(function(items){
    if(!Array.isArray(items)) return;
    var el=document.getElementById('dItems');
    if(!items.length){ el.innerHTML='<div class="card empty"><div class="eico">🥕</div>还没有人发起，快来发起第一单！</div>'; return; }
    el.innerHTML='<div class="card"><div class="hd2"><span class="ico">📋</span>已接龙需求</div>'+
      items.map(function(it){
        return '<div class="item"><span>'+esc(it.item_name)+' <span class="muted">'+esc((it.phones||[]).join('、'))+'</span></span><span class="q">'+fmtN(it.qty)+' '+esc(it.unit)+' <span class="muted">('+it.people+'人)</span></span></div>';
      }).join('')+'</div>';
  }).catch(function(){});
}
function doJoin(){
  var phone=document.getElementById('jPhone').value.trim();
  var qty=document.getElementById('jQty').value;
  var unit=document.getElementById('jUnit').value;
  var name=window._joinItem||'';
  okbar(false,''); errbar(false,'');
  if(!/^1\d{10}$/.test(phone)){ errbar(true,'请填写正确的11位手机号'); return; }
  if(!name){ errbar(true,'本团暂未设置商品，请联系老板'); return; }
  if(!qty||Number(qty)<=0){ errbar(true,'请填写份数'); return; }
  api('groupon_join',{p_session_id:curSession,p_phone:phone,p_item_name:name,p_qty:Number(qty),p_unit:unit}).then(function(r){
    if(r.ok){
      var tip='✅ 已参与本团（'+name+' '+fmtN(qty)+unit+'）。';
      if(r.deposit&&Number(r.deposit)>0) tip+=' 本团定金 ¥'+fmtN(r.deposit)+'/份，接龙确定后扫本店收款码支付。';
      okbar(true,tip); document.getElementById('jPhone').value=''; document.getElementById('jQty').value=''; showDetail();
    }
    else errbar(true,r.msg||'提交失败');
  }).catch(function(){ errbar(true,'网络异常，请重试'); });
}
function loadMy(){
  var phone=document.getElementById('myPhone').value.trim();
  errbar(false,''); okbar(false,'');
  if(!/^1\d{10}$/.test(phone)){ var el=document.getElementById('myRecs'); el.innerHTML='<div class="myrec" style="color:#c62828;">请填写正确的11位手机号</div>'; return; }
  api('groupon_my',{p_session_id:curSession,p_phone:phone}).then(function(r){
    var el=document.getElementById('myRecs');
    if(!Array.isArray(r)||!r.length){ el.innerHTML='<div class="myrec" style="color:#999;">该手机号在本团暂无记录</div>'; return; }
    var sessObj=null, wdObj={count30:0,ban_days:0};
    r.forEach(function(rec){ if(rec._session) sessObj=rec._session; if(rec._withdraw) wdObj=rec._withdraw; });
    var sess=sessObj||{}; var wd=wdObj;
    window._wd=wd;
    el.innerHTML=r.map(function(rec){
      if(rec._session||rec._withdraw) return '';
      var st={joined:'已参与·待确认',confirmed:'已确认',picked:'已取货',withdrawn:'已退出',cancelled:'团已取消',missed:'未取货'}[rec.status]||rec.status;
      var btn='';
      if(rec.status==='joined'&&sess.status==='quoted'&&sess.unit_price!=null)
        btn='<button class="btn btn-p" style="margin-top:8px;" onclick="doConfirm(\''+phone+'\')">确认购买 ¥'+fmtN(sess.unit_price)+'</button>';
      var dep='';
      if(Number(rec.deposit)>0 && rec.status!=='withdrawn' && rec.status!=='cancelled'){
        var depAmt=Number(rec.deposit)*Number(rec.qty||0);
        var tail=sess.unit_price!=null?(Number(sess.unit_price)*Number(rec.qty||0)-depAmt):null;
        if(rec.status==='confirmed'){
          dep='<div style="font-size:12px;color:#ad6800;margin-top:2px;">定金 ¥'+fmtN(depAmt)+(rec.deposit_paid?'（已收）':'（未收）· 扫下方本店收款码支付')+(tail!=null?' · 尾款 ¥'+fmtN(tail)+'（到店付）':'')+'</div>'+
            ((rec.deposit_paid?'':'<div style="margin-top:8px;"><img src="'+esc(sess.pay_qr)+'" style="width:150px;height:150px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid rgba(0,0,0,.08);" onerror="this.outerHTML=\'<div style=&quot;font-size:12px;color:#bbb;padding:6px 0;&quot;>收款码未配置，到店扫码支付</div>\'"></div>'+
            '<div style="font-size:11.5px;color:#888;margin-top:4px;">扫本店收款码支付定金 ¥'+fmtN(depAmt)+'，尾款到店取货时支付</div>'))+
            (sess.pickup_time?'<div style="font-size:12px;color:#238600;margin-top:4px;">取货时间：'+esc(sess.pickup_time)+'</div>':'');
        } else {
          dep='<div style="font-size:12px;color:#ad6800;margin-top:2px;">本团定金 ¥'+fmtN(depAmt)+'，接龙确定后扫本店收款码支付'+(tail!=null?' · 尾款 ¥'+fmtN(tail)+'（到店付）':'')+'</div>'+
            (sess.pickup_time?'<div style="font-size:12px;color:#238600;margin-top:2px;">取货时间：'+esc(sess.pickup_time)+'</div>':'');
        }
      }
      var wbtn='';
      if((rec.status==='joined'||rec.status==='confirmed')&&(sess.status==='open'||sess.status==='quoted'))
        wbtn='<button class="btn btn-r" style="margin-top:8px;padding:6px 12px;font-size:13px;" onclick="doWithdraw(\''+phone+'\')">退团</button>';
      var qr='';
      if(rec.status==='confirmed'&&sess.status!=='cancelled'){
        qr='<div class="myqr" style="margin-top:10px;text-align:center;background:#fff;border-radius:14px;padding:10px;border:1px solid rgba(0,0,0,.07);box-shadow:0 2px 10px rgba(0,0,0,.05);">'+
          '<div id="qr_'+rec.id+'"></div>'+
          '<div style="font-size:11.5px;color:#777;margin-top:6px;">取货二维码 · 到店出示，老板扫码核销</div></div>';
      }
      return '<div class="myrec"><b>'+esc(rec.item_name)+'</b> × '+fmtN(rec.qty)+' '+esc(rec.unit)+'<br><span class="muted">状态：'+st+'</span>'+dep+'<div style="display:flex;gap:8px;">'+btn+wbtn+'</div>'+qr+'</div>';
    }).join('')+'<div class="muted" style="margin-top:8px;">单价 ¥'+(sess.unit_price!=null?fmtN(sess.unit_price):'待报价')+' · 团状态：'+stName(sess.status)+'</div>'+
    '<div style="margin-top:6px;font-size:12px;color:#888;">近30天已退团 '+Number(wd.count30||0)+'/3 次'+(wd.ban_days>0?' · ⛔ 已触发30天禁参，剩余 '+wd.ban_days+' 天':'')+'</div>';
    try{
      r.forEach(function(rec){
        if(rec._session||rec._withdraw) return;
        if(rec.status==='confirmed'&&sess.status!=='cancelled'){
          var q0=qrcode(4,'M'); q0.addData('ZZGP|'+curSession+'|'+rec.id); q0.make();
          document.getElementById('qr_'+rec.id).innerHTML=q0.createImgTag(6,4);
        }
      });
    }catch(e){}
  }).catch(function(){ document.getElementById('myRecs').innerHTML='<div class="myrec" style="color:#c62828;">查询失败</div>'; });
}
function doWithdraw(phone){
  var wd=window._wd||{count30:0,ban_days:0};
  var msg='确定退出本团吗？\n退出后不可再参与本团。\n您近30天已退团 '+(Number(wd.count30)||0)+' 次，满3次将30天内不能参团。';
  if(!confirm(msg)) return;
  api('groupon_withdraw',{p_session_id:curSession,p_phone:phone}).then(function(r){
    if(r.ok){
      var n=Number(r.withdraw_count30)||0;
      var tip='✅ 已退团。';
      if(n>=3) tip+=' 您近30天退团已达 '+n+' 次，30天内将不能参与任何团购。';
      okbar(true,tip); loadMy();
    }
    else errbar(true,r.msg||'退团失败');

}
function doConfirm(phone){
  if(!confirm('确认按团购单价购买？确认后老板将按此进货，请按时取货。')) return;
  api('groupon_confirm',{p_session_id:curSession,p_phone:phone}).then(function(r){
    if(r.ok){
      var tip='✅ 已确认！';
      if(Number(r.deposit)>0) tip+=' 请扫本店收款码支付定金 ¥'+(Number(r.deposit)*Number(document.getElementById('jQty').value||1))+'（见下方我的记录）。';
      else tip+=' 等老板进货，到货后请来取。';

      okbar(true,tip); loadMy();
    }
    else errbar(true,r.msg||'确认失败');
  }).catch(function(){ errbar(true,'网络异常，请重试'); });
}
function okbar(on,t){ var e=document.getElementById('okbar'); e.style.display=on?'block':'none'; e.textContent=t; }
function errbar(on,t){ var e=document.getElementById('errbar'); e.style.display=on?'block':'none'; e.textContent=t; }
/* ===== 应季水果库（顾客端） ===== */
var PLAN_ARR=[];
function sessTitle(){ return window._sessTitle||''; }
function parseWindows(str){
  var wins=[];
  if(!str) return wins;
  str=String(str).trim();
  if(str.indexOf('全年')>=0) return [{fullYear:true,start:1,end:12}];
  str.split(/[,，]/).forEach(function(p){
    p=p.trim();
    var m=p.match(/(\d{1,2})\s*[-—~至]\s*(\d{1,2})\s*月?/);
    if(m){ var x=parseInt(m[1],10), y=parseInt(m[2],10); if(x>=1&&x<=12&&y>=1&&y<=12) wins.push({fullYear:false,start:x,end:y}); }
    else { var s=p.match(/(\d{1,2})\s*月?/); if(s){ var v=parseInt(s[1],10); if(v>=1&&v<=12) wins.push({fullYear:false,start:v,end:v}); } }
  });
  return wins;
}
function inWin(w,m){
  if(w.fullYear) return true;
  var c=w.start;
  while(true){ if(c===m) return true; if(c===w.end) break; c=(c%12)+1; }
  return false;
}
function monthsSet(str){
  var set=[];
  parseWindows(str).forEach(function(w){
    if(w.fullYear){ for(var i=1;i<=12;i++) set.push(i); return; }
    var c=w.start;
    while(true){ set.push(c); if(c===w.end) break; c=(c%12)+1; }
  });
  return set;
}
function tasteOf(f,m){
  var wins=parseWindows(f.months);
  var inSeason=wins.some(function(w){ return inWin(w,m); });
  if(!inSeason) return 'normal';
  if(monthsSet(f.best_months).indexOf(m)>=0) return 'best';
  var isTail=wins.some(function(w){ return !w.fullYear && w.end===m; });
  if(isTail) return 'tail';
  return 'good';
}
var TASTE_META={best:{t:'当季最佳',c:'t-best'},good:{t:'不错',c:'t-good'},tail:{t:'尾季',c:'t-tail'},normal:{t:'一般',c:'t-normal'}};
function fruitImg(f,cls){
  if(f.img_url && f.img_status!=='待换图') return '<img class="'+cls+'" loading="lazy" src="fruits_img/'+f.id+'.jpg" onerror="if(this.__fb){this.outerHTML=\'<div class=&quot;ph&quot;>待换图</div>\'}else{this.__fb=1;this.src=\''+esc(f.img_url)+'\'}">';
  return '<div class="ph">待换图</div>';
}
function loadRec(){
  var box=document.getElementById('recBox');
  api('groupon_fruits_list',{}).then(function(arr){
    arr=Array.isArray(arr)?arr:[];
    var m=new Date().getMonth()+1;
    var best=arr.filter(function(f){ return monthsSet(f.best_months).indexOf(m)>=0; });
    if(best.length<8){
      var extra=arr.filter(function(f){ return monthsSet(f.months).indexOf(m)>=0 && monthsSet(f.best_months).indexOf(m)<0; });
      best=best.concat(extra);
    }
    best=best.slice(0,8);
    if(!best.length){ box.innerHTML=''; return; }
    box.innerHTML='<div class="card"><div class="hd2"><span class="ico">🍎</span>本月当季推荐</div><div class="recStrip">'+
      best.map(function(f){
        return '<div class="recItem">'+fruitImg(f,'thumb')+
          '<div style="font-size:12.5px;font-weight:800;margin-top:5px;">'+esc(f.name)+'</div>'+
          '<div style="margin-top:4px;"><span class="badge t-best" style="font-size:10px;padding:2px 8px;">当季最佳</span></div></div>';
      }).join('')+'</div></div>';
  }).catch(function(){ box.innerHTML=''; });
}
function loadPlanCust(){
  var box=document.getElementById('dPlan');
  api('groupon_plan_list',{p_session_id:curSession}).then(function(arr){
    arr=Array.isArray(arr)?arr:[];
    PLAN_ARR=arr;
    var jit=document.getElementById('jItemTip');
    if(arr.length){ window._joinItem=arr[0].name; if(jit) jit.textContent='本团商品：'+arr[0].name; }
    else { window._joinItem=''; if(jit) jit.textContent='本团商品：'+sessTitle(); }
    if(!arr.length){ box.innerHTML=''; return; }
    var m=new Date().getMonth()+1;
    box.innerHTML='<div class="card"><div class="hd2"><span class="ico">🍎</span>团购方案 <span class="muted" style="font-weight:400;">（老板精选 '+arr.length+' 种应季水果）</span></div>'+
      arr.map(function(f,i){
        var thumb=(f.img_url&&f.img_status!=='待换图')?('<img loading="lazy" src="fruits_img/'+f.id+'.jpg" style="width:52px;height:52px;object-fit:cover;border-radius:10px;background:#f0f2f0;flex:none;" onerror="if(!this.__fb){this.__fb=1;this.src=\''+esc(f.img_url)+'\'}else{this.style.display=\'none\'}">'):'<div style="width:52px;height:52px;border-radius:10px;background:#eceff0;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:10px;flex:none;">待换图</div>';
        var tk=tasteOf(f,m), tm=TASTE_META[tk];
        return '<div class="item" style="align-items:center;">'+
          '<div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0;">'+thumb+
            '<div style="min-width:0;"><b style="font-size:14px;">'+esc(f.name)+'</b>'+
            '<div class="muted" style="margin-top:2px;">'+esc(f.origin||'-')+' · '+esc(f.months||'-')+'</div>'+
            '<div style="margin-top:4px;"><span class="badge '+tm.c+'" style="font-size:10px;padding:2px 8px;">'+tm.t+'·按'+m+'月</span>'+
            (f.price_ref?' <span class="muted">参考价 '+esc(f.price_ref)+'</span>':'')+'</div></div>'+
          '</div>'+
          '<button class="btn btn-p" style="width:auto;margin:0 0 0 8px;padding:8px 12px;font-size:12.5px;flex:none;" onclick="pickPlanFruit('+i+')">参与本团</button>'+
        '</div>';
      }).join('')+'</div>';
  }).catch(function(){ box.innerHTML=''; });
}
function pickPlanFruit(i){
  var f=PLAN_ARR[i]; if(!f) return;
  window._joinItem=f.name;
  document.getElementById('jItemTip').textContent='本团商品：'+f.name;
  document.getElementById('jPhone').focus();
}
showList();
</script>
<script>
/* 下拉刷新：页面顶部下拉超过阈值即重新加载（横向滑动不触发，防误触） */
(function(){
  var pulling=false, startY=0, startX=0, dist=0, horiz=false, tip=null;
  function mkTip(){
    tip=document.createElement('div');
    tip.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99998;display:none;justify-content:center;align-items:flex-end;padding-bottom:10px;height:0;overflow:hidden;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);color:#238600;font-size:13px;font-weight:700;border-bottom:1px solid rgba(35,134,0,.12)';
    tip.textContent='下拉刷新';
    document.body.appendChild(tip);
  }
  document.addEventListener('touchstart',function(e){ if(window.scrollY<=0){ pulling=true; startY=e.touches[0].clientY; startX=e.touches[0].clientX; dist=0; horiz=false; } },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!pulling) return;
    var y=e.touches[0].clientY-startY, x=e.touches[0].clientX-startX;
    if(Math.abs(x)>Math.abs(y)){ horiz=true; }
    if(horiz){ if(tip){ tip.style.display='none'; } return; }
    dist=y;
    if(dist>0){ if(!tip) mkTip(); tip.style.display='flex'; tip.style.height=Math.min(dist,86)+'px'; tip.textContent=dist>80?'松开刷新':'下拉刷新'; }
  },{passive:true});
  document.addEventListener('touchend',function(){ if(!pulling) return; pulling=false; if(tip){ tip.style.display='none'; } if(!horiz && dist>80){ location.reload(); } },{passive:true});
})();
</script>
