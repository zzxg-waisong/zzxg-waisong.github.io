<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>榨榨鲜果 · 外卖点单</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7f8;color:#333}
.hidden{display:none!important}
/* 顶部 */
.topbar{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#43a047,#66bb6a);color:#fff;padding:14px 16px 10px}
.topbar h1{font-size:20px;font-weight:700}
.topbar p{font-size:12px;opacity:.92;margin-top:2px}
.cats{display:flex;gap:8px;background:#fff;padding:10px 12px;border-bottom:1px solid #eee;position:sticky;top:56px;z-index:15;overflow-x:auto}
.cat{flex:0 0 auto;padding:7px 18px;border-radius:18px;background:#f0f1f2;font-size:14px;color:#555;cursor:pointer}
.cat.on{background:#43a047;color:#fff;font-weight:600}
/* 商品 */
.list{padding:12px 12px 90px}
.dish{display:flex;background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.dish .info{flex:1}
.dish .name{font-size:16px;font-weight:600}
.dish .unit{font-size:12px;color:#999;margin-top:2px}
.dish .price{color:#e53935;font-weight:700;font-size:17px;margin-top:6px}
.dish .price small{font-size:12px;font-weight:400;color:#999}
.dish .dimg{width:86px;height:86px;flex:0 0 auto;border-radius:10px;overflow:hidden;margin-right:12px;background:#fff}
.dish .dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dish .ctrl{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px}
.dish input.note{width:130px;border:1px solid #e0e0e0;border-radius:6px;padding:5px 8px;font-size:12px;color:#555}
.btn{background:#43a047;color:#fff;border:none;border-radius:20px;padding:6px 16px;font-size:14px;cursor:pointer}
.btn:active{opacity:.8}
.btn.orange{background:#fb8c00}
.btn.red{background:#e53935}
.btn.gray{background:#9e9e9e}
.btn.outline{background:#fff;color:#43a047;border:1px solid #43a047}
.admin-entry{background:#fff;color:#2e7d32;border:none;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.18);flex:0 0 auto}
.btn[disabled]{opacity:.5}
/* 购物车 */
.cartbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #eee;padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:30;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
.cartbar .total{flex:1;font-size:16px;font-weight:700}
.cartbar .total small{font-weight:400;color:#999;font-size:12px}
.drawer{position:fixed;left:0;right:0;bottom:0;top:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.drawer.show{display:block}
.drawer .panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;max-height:70vh;overflow:auto;padding:16px}
.drawer .phead{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.cart-item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0;gap:8px}
.cart-item .n{flex:1;font-size:14px}
.cart-item .n small{display:block;color:#999;font-size:12px;margin-top:2px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:26px;height:26px;border-radius:50%;border:1px solid #ccc;background:#fff;font-size:16px;cursor:pointer;line-height:1}
.qty span{min-width:20px;text-align:center;font-size:15px}
/* 表单 */
.form{padding:14px}
.form label{font-size:13px;color:#666;display:block;margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:15px;background:#fff}
.field-row{display:flex;gap:8px}
.field-row>*{flex:1}
/* 付款页 */
.pay{max-width:520px;margin:0 auto;padding:14px}
.pay .amt{text-align:center;background:linear-gradient(135deg,#43a047,#66bb6a);color:#fff;border-radius:14px;padding:22px;margin-bottom:14px}
.pay .amt .t{font-size:13px;opacity:.9}
.pay .amt .n{font-size:34px;font-weight:800;margin-top:4px}
.qrbox{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.qrbox .qt{font-size:15px;font-weight:700;margin-bottom:10px}
.qrbox img{width:min(78vw,320px);height:auto;border-radius:8px;cursor:zoom-in}
.qrbox .hint{font-size:12px;color:#888;margin-top:8px;line-height:1.6}
.qrbox .acts{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
/* 订单文字 */
.ordertext{background:#fff;border-radius:14px;padding:14px;margin:12px 0;white-space:pre-wrap;font-size:13px;line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.06)}
/* 商家后台 */
.admin-top{position:sticky;top:0;z-index:20;background:#263238;color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.admin-top h2{font-size:17px}
.admin-tabs{display:flex;background:#fff;border-bottom:1px solid #eee;overflow-x:auto;position:sticky;top:48px;z-index:15}
.admin-tabs button{flex:0 0 auto;border:none;background:none;padding:12px 16px;font-size:14px;color:#555;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.admin-tabs button.on{color:#43a047;border-bottom-color:#43a047;font-weight:600}
.panel{padding:14px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{font-size:15px;margin-bottom:8px}
.rowline{display:flex;justify-content:space-between;font-size:13px;color:#555;margin:4px 0}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#e8f5e9;color:#2e7d32}
.badge.off{background:#eee;color:#999}
.login-box{max-width:320px;margin:60px auto;text-align:center}
.login-box input{width:100%;border:1px solid #ddd;border-radius:8px;padding:12px;font-size:16px;margin-bottom:12px;text-align:center}
/* 模态 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:14px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
.modal .box img{width:100%}
/* 打印样式 */
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:48mm;font-size:11px;line-height:1.5;font-family:"Microsoft YaHei",monospace}
}
#printArea{display:none}
</style>
</head>
<body>

<!-- ================= 顾客端 ================= -->
<div id="customer">
  <div class="topbar">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
      <div>
        <h1>🍉 榨榨鲜果</h1>
        <p>新鲜水果 · 现榨果汁 · 0添加 · 更健康 · 免费配送</p>
      </div>
      <button class="admin-entry" onclick="location.hash='#/admin'">🔒 商家后台</button>
    </div>
  </div>
  <div class="cats" id="cats"></div>
  <div class="list" id="dishList"></div>

  <div class="cartbar hidden" id="cartbar">
    <div class="total"><span id="cartCount">0</span> 件 · <span id="cartTotal">¥0</span></div>
    <button class="btn" id="btnCart" onclick="openDrawer()">查看购物车</button>
  </div>
</div>

<!-- 购物车抽屉 -->
<div class="drawer" id="drawer" onclick="if(event.target===this)closeDrawer()">
  <div class="panel">
    <div class="phead">购物车 <button class="btn gray" style="font-size:12px;padding:4px 12px" onclick="closeDrawer()">关闭</button></div>
    <div id="cartItems"></div>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center">
      <div style="font-size:15px;font-weight:700">合计：<span style="color:#e53935" id="drawerTotal">¥0</span></div>
      <button class="btn" onclick="openCheckout()">去结算</button>
    </div>
  </div>
</div>

<!-- 结算表单 -->
<div class="modal" id="checkoutModal">
  <div class="box">
    <h3 style="margin-bottom:6px">填写配送信息</h3>
    <div class="form" style="padding:0">
      <label>您的称呼</label><input id="ckName" placeholder="例如：王女士">
      <label>联系电话</label><input id="ckPhone" type="tel" placeholder="手机号">
      <label>外卖地址</label><textarea id="ckAddr" rows="2" placeholder="小区/楼栋/门牌号，写详细些方便配送"></textarea>
      <label>预送时间段</label>
      <select id="ckTime">
        <option value="尽快送达">尽快送达</option>
        <option value="10:00-11:00">10:00 - 11:00</option>
        <option value="11:00-12:00">11:00 - 12:00</option>
        <option value="12:00-13:00">12:00 - 13:00</option>
        <option value="13:00-14:00">13:00 - 14:00</option>
        <option value="14:00-15:00">14:00 - 15:00</option>
        <option value="15:00-16:00">15:00 - 16:00</option>
        <option value="16:00-17:00">16:00 - 17:00</option>
        <option value="17:00-18:00">17:00 - 18:00</option>
        <option value="18:00-19:00">18:00 - 19:00</option>
        <option value="19:00-20:00">19:00 - 20:00</option>
      </select>
      <label>备注（可选）</label><input id="ckRemark" placeholder="例如：放门口 / 敲门">
      <div style="display:flex;gap:8px;margin-top:16px">
        <button class="btn gray" style="flex:1" onclick="closeCheckout()">返回</button>
        <button class="btn" style="flex:1" onclick="submitOrder()">提交订单</button>
      </div>
    </div>
  </div>
</div>

<!-- 付款页 -->
<div class="modal" id="payModal">
  <div class="box" style="max-width:520px">
    <h3 style="text-align:center;margin-bottom:10px">订单已提交，请扫码付款</h3>
    <div class="pay" style="padding:0">
      <div class="amt">
        <div class="t">应付金额</div>
        <div class="n" id="payAmt">¥0</div>
      </div>
      <div class="qrbox">
        <div class="qt">请使用微信 / 支付宝扫码付款</div>
        <img id="payImg" src="收款码.png" onclick="zoomImg(this.src)" alt="收款码">
        <div class="hint">长按图片可识别二维码 · 也可点下方"保存到相册"，再用微信/支付宝扫一扫→相册选择</div>
        <div class="acts">
          <button class="btn" onclick="saveImg('payImg')">保存收款码到相册</button>
          <button class="btn gray" onclick="zoomImg(document.getElementById('payImg').src)">放大</button>
        </div>
      </div>
      <div class="qrbox">
        <div class="qt">添加店主微信 / 直接转账</div>
        <img id="wxImg" src="微信二维码.png" onclick="zoomImg(this.src)" alt="微信">
        <div class="acts">
          <button class="btn orange" onclick="saveImg('wxImg')">保存微信码</button>
        </div>
      </div>
      <button class="btn" style="width:100%;padding:13px;font-size:16px" onclick="payDone()">我 已 付 款</button>
      <p style="text-align:center;font-size:12px;color:#999;margin-top:8px">付款后点击上方按钮，自动整理订单发给店主</p>
    </div>
  </div>
</div>

<!-- 图片放大 -->
<div class="modal" id="zoomModal">
  <div class="box" style="max-width:480px;background:#000;padding:8px">
    <img id="zoomImg" src="" style="width:100%;border-radius:8px">
    <p style="text-align:center;color:#fff;font-size:12px;margin-top:6px">长按保存 / 识别二维码</p>
  </div>
</div>

<!-- ================= 商家后台 ================= -->
<div id="admin" class="hidden">
  <div class="admin-top">
    <h2>商家后台</h2>
    <div>
      <button class="btn gray" style="font-size:12px;padding:4px 10px" onclick="backToShop()">返回点单页</button>
      <button class="btn red" style="font-size:12px;padding:4px 10px;margin-left:6px" onclick="adminLogout()">退出</button>
    </div>
  </div>
  <div class="admin-tabs" id="adminTabs"></div>
  <div id="adminPanel"></div>
</div>

<!-- 登录 -->
<div class="modal show" id="loginModal">
  <div class="box">
    <div class="login-box" style="margin:0 auto">
      <h2 style="margin-bottom:18px">🔒 商家后台</h2>
      <input type="password" id="adminPwd" placeholder="请输入密码" style="margin-bottom:16px">
      <button class="btn" style="width:100%;padding:12px" onclick="adminLogin()">登录</button>
      <p style="font-size:12px;color:#999;margin-top:14px;line-height:1.7">默认密码 123456，请登录后尽快在"设置"中修改<br>忘记密码：清除浏览器站点数据后恢复默认</p>
    </div>
  </div>
</div>

<!-- 打印内容（隐藏） -->
<div id="printArea"></div>

<script src="qrcode.js"></script>
<script>
/* ==================== 数据层 ==================== */
var LS_DISHES='fruit_dishes', LS_ORDERS='fruit_orders', LS_PWD='fruit_admin_pwd',
    LS_PAY='fruit_pay', LS_SHOP='fruit_shop', LS_SESSION='fruit_admin_ok';

function defaultDishes(){
  return [
    {id:'d1',name:'无籽麒麟西瓜（10斤左右）',price:40,unit:'个',cat:'水果',on:true,img:'wuzi_qilin_xigua.jpg'},
    {id:'d2',name:'地雷西瓜（1/4个）',price:12,unit:'份',cat:'水果',on:true,img:'dilei_xigua.jpg'},
    {id:'d3',name:'老挝香蕉（5根 2.5-3斤）',price:12.5,unit:'份',cat:'水果',on:true,img:'laowo_xiangjiao.jpg'},
    {id:'d4',name:'海南香蕉（9根/半爪 3-3.5斤）',price:10,unit:'份',cat:'水果',on:true,img:'hainan_xiangjiao.jpg'},
    {id:'d5',name:'凉山盐源糖心丑苹果（4个 1.5-2斤）',price:15,unit:'份',cat:'水果',on:true,img:'tangxin_choupingguo.jpg'},
    {id:'d6',name:'陕西红富士苹果（4个 1.5-2斤）',price:12,unit:'份',cat:'水果',on:true,img:'hongfushi_pingguo.jpg'},
    {id:'d7',name:'青苹果（4个 1.8-2斤）',price:10,unit:'份',cat:'水果',on:true,img:'qing_pingguo.jpg'},
    {id:'d8',name:'石榴',price:4,unit:'个',cat:'水果',on:true,img:'shiliu.jpg'},
    {id:'d9',name:'石榴（大）',price:5,unit:'个',cat:'水果',on:true,img:'da_shiliu.jpg'},
    {id:'d10',name:'花皮石榴',price:3,unit:'个',cat:'水果',on:true,img:'huapi_shiliu.jpg'},
    {id:'d11',name:'花皮石榴（大）',price:4,unit:'个',cat:'水果',on:true,img:'dahuapi_shiliu.jpg'},
    {id:'d12',name:'海南红心柚（约3斤）',price:15,unit:'个',cat:'水果',on:true,img:'hongxin_you.jpg'},
    {id:'d13',name:'黄皮哈密瓜',price:20,unit:'个',cat:'水果',on:true,img:'huangpi_hamigua.jpg'},
    {id:'d14',name:'哈密瓜',price:18,unit:'个',cat:'水果',on:true,img:'hamigua.jpg'},
    {id:'d15',name:'小番茄（约1斤）',price:8,unit:'盒',cat:'水果',on:true,img:'xiaofanqie.jpg'},
    {id:'d16',name:'小柿子（8颗装）',price:10,unit:'盒',cat:'水果',on:true,img:'xiaoshizi.jpg'},
    {id:'j1',name:'西瓜汁（500ml）',price:8,unit:'杯',cat:'果汁',on:true,img:'xiguazhi.jpg'},
    {id:'j2',name:'麒麟西瓜汁（500ml）',price:12,unit:'杯',cat:'果汁',on:true,img:'qilin_xiguazhi.jpg'},
    {id:'j3',name:'石榴汁（500ml）',price:15,unit:'杯',cat:'果汁',on:true,img:'shiliuzhi.jpg'},
    {id:'j4',name:'盐源苹果汁（500ml）',price:15,unit:'杯',cat:'果汁',on:true,img:'pingguozhi.jpg'},
    {id:'j5',name:'青苹果汁（500ml）',price:12,unit:'杯',cat:'果汁',on:true,img:'qingpingguozhi.jpg'},
    {id:'j6',name:'哈密瓜汁（500ml）',price:10,unit:'杯',cat:'果汁',on:true,img:'hamiguazhi.jpg'},
    {id:'j7',name:'黄皮哈密瓜汁（500ml）',price:12,unit:'杯',cat:'果汁',on:true,img:'huangpihamiguazhi.jpg'}
  ];
}
function load(k, def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k, v){ localStorage.setItem(k, JSON.stringify(v)); }

var dishes = load(LS_DISHES, null); if(!dishes||!dishes.length) dishes=defaultDishes();
var orders = load(LS_ORDERS, []);
var payCfg = load(LS_PAY, {payUrl:'收款码.png', wxUrl:'微信二维码.png'});
var shopCfg = load(LS_SHOP, {address:''});
var adminOk = localStorage.getItem(LS_SESSION)==='1';
var cart = {};   // id -> {qty,note}
var curCat = '水果';
var curOrder = null;

/* ==================== 通用 ==================== */
function money(n){ return '¥'+Number(n).toFixed(2); }
function nowStr(){ var d=new Date(); function p(x){return (x<10?'0':'')+x;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); }
function oid(){ var d=new Date(); return d.getFullYear()+''+p2(d.getMonth()+1)+''+p2(d.getDate())+'-'+String(Math.floor(100+Math.random()*900)); }
function p2(x){return (x<10?'0':'')+x;}

/* ==================== 路由 ==================== */
function route(){
  var h=location.hash||'#/';
  if(h.indexOf('#/admin')===0){ showAdmin(); }
  else { showCustomer(); }
}
window.addEventListener('hashchange', route);

/* ==================== 顾客端 ==================== */
function showCustomer(){
  document.getElementById('admin').classList.add('hidden');
  document.getElementById('customer').classList.remove('hidden');
  document.getElementById('loginModal').classList.remove('show');
  renderCats(); renderDishes(); renderCartbar();
}
function cats(){ var c=[]; dishes.forEach(function(d){ if(d.on && c.indexOf(d.cat)<0) c.push(d.cat); }); if(!c.length) c=['水果','果汁']; return c; }
function catLabel(c){ return c==='水果'?'新鲜水果':(c==='果汁'?'现榨果汁':c); }
function renderCats(){
  var box=document.getElementById('cats'); var html='';
  cats().forEach(function(c){ html+='<div class="cat'+(c===curCat?' on':'')+'" onclick="setCat(\''+c+'\')">'+catLabel(c)+'</div>'; });
  box.innerHTML=html;
}
function setCat(c){ curCat=c; renderCats(); renderDishes(); }
function renderDishes(){
  var box=document.getElementById('dishList'); var html='';
  dishes.forEach(function(d){
    if(d.cat!==curCat || !d.on) return;
    var c=cart[d.id]||{qty:0,note:''};
    var img=(d.img===undefined)?(d.id+'.jpg'):d.img;
    var imgHtml=img?'<div class="dimg"><img src="'+esc(img)+'" alt="'+esc(d.name)+'" loading="lazy" onclick="zoomImg(this.src)"></div>':'';
    html+='<div class="dish">'+imgHtml+'<div class="info"><div class="name">'+esc(d.name)+'</div>'+
      '<div class="unit">'+esc(d.unit||'')+'</div>'+
      '<div class="price">'+money(d.price)+'<small> / '+esc(d.unit||'份')+'</small></div></div>'+
      '<div class="ctrl">'+(d.cat==='果汁'?'<input class="note" placeholder="口味/甜度/去冰" value="'+esc(c.note)+'" onchange="setNote(\''+d.id+'\',this.value)">':'')+
      '<button class="btn" onclick="addToCart(\''+d.id+'\')">加入购物车</button></div></div>';
  });
  box.innerHTML=html || '<div style="text-align:center;color:#999;padding:40px">该分类暂无商品</div>';
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function addToCart(id){
  if(!cart[id]) cart[id]={qty:0,note:''};
  cart[id].qty++; renderDishes(); renderCartbar();
}
function setNote(id,val){ if(!cart[id]) cart[id]={qty:0,note:''}; cart[id].note=val; }
function changeQty(id,delta){ if(!cart[id]) cart[id]={qty:0,note:''}; cart[id].qty+=delta; if(cart[id].qty<=0) delete cart[id]; renderCartItems(); renderCartbar(); renderDishes(); }
function cartList(){ var r=[]; for(var id in cart){ if(cart[id].qty>0) r.push({id:id,qty:cart[id].qty,note:cart[id].note}); } return r; }
function cartTotal(){ var t=0; cartList().forEach(function(c){ var d=byId(c.id); if(d) t+=d.price*c.qty; }); return t; }
function byId(id){ for(var i=0;i<dishes.length;i++) if(dishes[i].id===id) return dishes[i]; return null; }
function renderCartbar(){
  var list=cartList(), n=0; list.forEach(function(c){n+=c.qty;});
  document.getElementById('cartbar').classList.toggle('hidden', n===0);
  document.getElementById('cartCount').textContent=n;
  document.getElementById('cartTotal').textContent=money(cartTotal());
}

function submitOrder(){
  var name=document.getElementById('ckName').value.trim();
  var phone=document.getElementById('ckPhone').value.trim();
  var addr=document.getElementById('ckAddr').value.trim();
  var time=document.getElementById('ckTime').value;
  var remark=document.getElementById('ckRemark').value.trim();
  if(!name){ alert('请填写称呼'); return; }
  if(!/^1\d{10}$/.test(phone) && phone.length<7){ alert('请填写正确的联系电话'); return; }
  if(!addr){ alert('请填写外卖地址'); return; }
  var list=cartList(); if(!list.length){ alert('购物车为空'); return; }
  var items=list.map(function(c){ var d=byId(c.id); return {name:d.name,price:d.price,qty:c.qty,note:c.note,unit:d.unit}; });
  var order={id:oid(), items:items, total:cartTotal(), name:name, phone:phone, addr:addr, time:time, remark:remark, created:nowStr(), status:'待付款'};
  orders.unshift(order); save(LS_ORDERS, orders);
  cart={}; renderDishes(); renderCartbar(); closeCheckout();
  curOrder=order; showPay(order);
}

function formatOrderText(o){
  var lines=[];
  lines.push('🍉 榨榨鲜果 外卖订单');
  lines.push('——————————————');
  lines.push('【订单号】'+o.id);
  lines.push('【下单时间】'+o.created);
  lines.push('【商品】');
  o.items.forEach(function(it){
    lines.push((it.note?('  '+it.name+'（'+it.note+'）'):('  '+it.name))+' ×'+it.qty+'  '+money(it.price*it.qty));
  });
  lines.push('——————————————');
  lines.push('【合计】'+money(o.total));
  lines.push('【顾客】'+o.name+'  '+o.phone);
  lines.push('【地址】'+o.addr);
  lines.push('【预送】'+o.time);
  if(o.remark) lines.push('【备注】'+o.remark);
  lines.push('【状态】'+o.status);
  return lines.join('\n');
}

function copyText(){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(window._lastText).then(function(){ alert('订单已复制！请打开微信粘贴发送给店主'); }, function(){ fallbackCopy(window._lastText); });
  } else { fallbackCopy(window._lastText); }
}
function fallbackCopy(text){
  var ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); alert('订单已复制！请打开微信粘贴发送给店主'); }catch(e){ alert('复制失败，请长按手动复制订单文字'); }

async function connectAndPrintLatest(){

}

}
async function writeReceipt(port, text){
  var writer=port.writable.getWriter();
  var enc=new TextEncoder();
  var init=new Uint8Array([0x1B,0x40]);        // 初始化
  var feed=new Uint8Array([0x1A]);             // 
  var data=[]; data.push.apply(data,init); 
  var body=enc.encode(text+'\n');
  for(var i=0;i<body.length;i++) data.push(body[i]);
  data.push(0x1B,0x4A,0x20);                    // 进纸
  var cut=new Uint8Array([0x1D,0x56,0x42,0x00]);// 切纸
  for(var j=0;j<cut.length;j++) data.push(cut[j]);
  await writer.write(new Uint8Array(data));
  writer.releaseLock();
  port.close();
}

}

function makeQr(text){
  try{
    var qr=qrcode(0,'H');
    qr.addData(text); qr.make();
    var count=qr.getModuleCount();
    var size=720, cell=Math.round(size/count), margin=36;
    var W=size+margin*2;
    var canvas=document.createElement('canvas');
    canvas.width=W; canvas.height=W;
    var ctx=canvas.getContext('2d');
    ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,W);
    var grad=ctx.createLinearGradient(0,0,W,W);
    grad.addColorStop(0,'#4caf50'); grad.addColorStop(1,'#1b5e20');
    ctx.fillStyle=grad;
    var rad=Math.max(2,Math.floor(cell*0.4));
    for(var r=0;r<count;r++){
      for(var c=0;c<count;c++){
        if(qr.isDark(r,c)){
          var x=margin+c*cell, y=margin+r*cell;
          ctx.beginPath();
          ctx.moveTo(x+rad,y);
          ctx.arcTo(x+cell,y,x+cell,y+cell,rad);
          ctx.arcTo(x+cell,y+cell,x,y+cell,rad);
          ctx.arcTo(x,y+cell,x,y,rad);
          ctx.arcTo(x,y,x+cell,y,rad);
          ctx.closePath(); ctx.fill();
        }
      }
    }
    // 中间白色圆角区 + 文字
    var cw=Math.floor(W*0.36);
    var cx=(W-cw)/2, cy=(W-cw)/2;
    ctx.fillStyle='#ffffff';
    ctx.beginPath();
    ctx.moveTo(cx+12,cy);
    ctx.arcTo(cx+cw,cy,cx+cw,cy+cw,12);
    ctx.arcTo(cx+cw,cy+cw,cx,cy+cw,12);
    ctx.arcTo(cx,cy+cw,cx,cy,12);
    ctx.arcTo(cx,cy,cx+cw,cy,12);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#66bb6a'; ctx.lineWidth=2; ctx.stroke();
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='#1b5e20';
    ctx.font='bold 16px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('榨榨鲜果', W/2, cy+cw*0.30);
    ctx.fillStyle='#43a047';
    ctx.font='13px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.fillText('· 外送点单 ·', W/2, cy+cw*0.68);
    var dataUrl=canvas.toDataURL('image/png');
    document.getElementById('qrBox').innerHTML='<img src="'+dataUrl+'" style="width:240px;height:240px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.08)">';
    window._qrDataUrl=dataUrl;
  }catch(e){ document.getElementById('qrBox').innerHTML='<p style="color:#e53935">二维码生成失败：'+esc(e.message)+'</p>'; }
}
function downloadQr(){
  var img=document.querySelector('#qrBox img');
  if(!img) return;
  var a=document.createElement('a');
  a.href=img.src; a.download='点单二维码.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

  var html='<div class="panel"><h3>设置</h3><div class="card">'+
    '<div class="rowline"><span>后台密码</span><span><a href="javascript:adminTab=\'shop\';renderAdmin()">去修改</a></span></div>'+
    '<div class="rowline"><span>数据存储</span><span>本机浏览器（localStorage）</span></div>'+
    '<button class="btn red" style="width:100%;margin-top:8px" onclick="resetData()">重置全部数据（恢复默认）</button></div></div>';
  return html;
}
function resetData(){
  if(confirm('确认清空本机所有数据？顾客端菜单不受影响。')){ localStorage.removeItem(LS_DISHES); localStorage.removeItem(LS_ORDERS); localStorage.removeItem(LS_PAY); localStorage.removeItem(LS_SHOP); location.reload(); }
}

route();
